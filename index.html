<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="비정형 텍스트와 경제 현상을 탐구하는 신현진의 연구 관심분야, 학력과 프로젝트 포트폴리오." />
    <meta name="theme-color" content="#faf9f6" />
    <title>신현진 | Portfolio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="content.js" defer></script>
    <script src="slides.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body id="top">
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
      <symbol id="icon-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 7 9 6 9-6" />
      </symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.69 2.79a2 2 0 0 1-.45 2.11L8.08 9.89a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.89.33 1.83.56 2.79.69A2 2 0 0 1 22 16.92z" />
      </symbol>
      <symbol id="icon-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7 .1l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7-.1l-3 3a5 5 0 0 0 7 7l2-2" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M7 7h10v10M7 17 17 7" />
      </symbol>
      <symbol id="icon-print" viewBox="0 0 24 24">
        <path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
        <path d="M6 14h12v7H6zM17 11h1" />
      </symbol>
      <symbol id="icon-github" viewBox="0 0 24 24">
        <path d="M9 19c-4.3 1.2-4.3-2.1-6-2.6M15 22v-3.8a3.3 3.3 0 0 0-.9-2.6c3-.4 6.2-1.5 6.2-6.9a5.4 5.4 0 0 0-1.5-3.7 5 5 0 0 0-.1-3.7s-1.2-.4-3.9 1.4a13 13 0 0 0-7 0C5.1.9 3.9 1.3 3.9 1.3a5 5 0 0 0-.1 3.7 5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.2 6.5 6.2 6.9a3.3 3.3 0 0 0-.9 2.6V22" />
      </symbol>
    </svg>

    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="개인 포트폴리오">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span class="brand-label">PORTFOLIO</span>
      </a>
      <div class="header-actions">
        <nav class="language-switch" aria-label="언어 선택">
          <button class="language-button" type="button" data-language="ko" lang="ko" aria-pressed="true">한국어</button>
          <span class="language-separator" aria-hidden="true">/</span>
          <button class="language-button" type="button" data-language="en" lang="en" aria-pressed="false">English</button>
        </nav>
        <button class="print-button" type="button">
          <svg class="icon" width="15" height="15" aria-hidden="true"><use href="#icon-print"></use></svg>
          <span data-label="print">인쇄 / PDF 저장</span>
        </button>
      </div>
    </header>

    <main id="main" class="cv-layout" tabindex="-1">
      <article class="cv-document" aria-label="개인 포트폴리오">
        <header id="profile" class="profile">
          <div class="profile-identity">
            <div class="profile-kicker">
              <p id="profile-kicker" class="eyebrow">PERSONAL PORTFOLIO</p>
              <span id="profile-label" class="application-label">연구 · 프로젝트</span>
            </div>
            <h1 id="profile-name">신현진</h1>
            <address id="contact-list" class="contact-list" hidden></address>
            <p id="print-url" class="print-url" hidden></p>
          </div>
        </header>

        <aside class="sidebar section-navigation">
          <p id="sidebar-title" class="eyebrow">목차</p>
          <nav aria-labelledby="sidebar-title">
            <ol id="table-of-contents"></ol>
          </nav>
        </aside>

        <div id="sections"></div>

        <footer class="document-footer">
          <span id="footer-label">신현진 · Portfolio</span>
          <a class="back-to-top" href="#top">
            <span data-label="backToTop">맨 위로</span>
            <svg class="icon" width="12" height="12" aria-hidden="true"><use href="#icon-arrow"></use></svg>
          </a>
        </footer>
      </article>
    </main>
    <noscript><p class="noscript-message">내용을 표시하려면 브라우저에서 JavaScript를 활성화해주세요.</p></noscript>
  </body>
</html>
